name: Deploy Backend Lambda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # manual deploy of main HEAD (recovery if a push event fails to fire a run)

# Least privilege: default GITHUB_TOKEN is too broad; this workflow only needs to read the repo.
permissions:
  contents: read

# Serialize prod deploys so out-of-order pushes can't overwrite a newer Lambda with an older build.
concurrency:
  # A PR check and a prod deploy are not the same thing and must not share a queue.
  # They did until 2026-08-02. Only ONE run may sit *pending* in a concurrency group,
  # so a PR run that queued while a deploy was in flight was cancelled before it ran a
  # single job — and a cancelled run reports **no check at all** on the PR, not a red
  # one. A missing gate reads like "nothing to wait for", which is the dangerous shape:
  # the merge rule requires green CI, and absent CI can be mistaken for satisfied CI.
  # (Observed on front #333; the PR run died with zero jobs at 08:02:21Z behind the
  # deploy of the preceding merge. Rare until now — it needs a deploy in flight at the
  # moment a PR queues — but concurrent sessions make that ordinary.)
  #
  # Prod deploys stay serialized under the single group they always had.
  # PR runs get one group per PR and supersede themselves, so a fixup push cancels the
  # older run of the SAME PR (wanted) and nothing else (the bug).
  group: ${{ github.event_name == 'pull_request' && format('backend-pr-{0}', github.event.number) || 'backend-deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install lock compiler
        run: python -m pip install uv==0.12.7

      - name: Check dependency lock
        run: ./scripts/check_requirements_lock.sh

      - name: Verify repeatable arm64 Lambda bundle
        run: |
          set -euo pipefail
          TARGET_ONE="$(mktemp -d)"
          TARGET_TWO="$(mktemp -d)"
          trap 'rm -rf "$TARGET_ONE" "$TARGET_TWO"' EXIT
          for target in "$TARGET_ONE" "$TARGET_TWO"; do
            python -m pip install --no-deps -r requirements.lock -t "$target" \
              --platform manylinux2014_aarch64 \
              --python-version 3.12 \
              --implementation cp \
              --abi cp312 \
              --only-binary=:all:
          done
          python scripts/distribution_manifest.py "$TARGET_ONE" > /tmp/manifest-one.txt
          python scripts/distribution_manifest.py "$TARGET_TWO" > /tmp/manifest-two.txt
          diff -u /tmp/manifest-one.txt /tmp/manifest-two.txt
          cp -r app "$TARGET_ONE"/
          (cd "$TARGET_ONE" && python -m zipfile -c /tmp/backend-bundle.zip .)
          test -s /tmp/backend-bundle.zip
          docker run --rm --platform linux/arm64 \
            -e ENV=local \
            -e DATABASE_URL=postgresql+psycopg://x:x@localhost/x \
            -v "${TARGET_ONE}:/var/task:ro" -w /var/task \
            --entrypoint /bin/bash public.ecr.aws/lambda/python:3.12 \
            -lc "python -c 'from app.main import handler; assert callable(handler)'"

      - name: Install dependencies
        run: pip install -r requirements.lock pyright

      - name: Type check (pyright)
        run: pyright app/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      # Unit suite only. Integration tests (tests/integration/*) are marked
      # `integration` and require a real DB via TEST_DB_URL — excluded from the
      # PR gate; they self-skip anyway when TEST_DB_URL is unset.
      - name: Run tests
        run: pytest -m "not integration"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Verify openapi.json is up to date
        env:
          DATABASE_URL: "postgresql+psycopg://x:x@localhost/x"
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  # Required real-DB suite against disposable local Postgres. Keep this job id
  # and check name exactly `integration`: the main ruleset requires that context.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myblog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myblog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Check out canonical schema
        uses: actions/checkout@v4
        with:
          repository: hyuntohoon/myblog_shared_db
          ref: 90a6fca4a0528a0ed37be3a514e86ad379373042
          token: ${{ secrets.SHARED_DB_PAT }}
          persist-credentials: false
          path: shared-db-schema

      - name: Load canonical schema
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -U postgres -d myblog_test --set ON_ERROR_STOP=on \
            < shared-db-schema/tests/canonical_schema.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      - name: Run integration suite
        env:
          TEST_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/myblog_test
          DATABASE_URL: "postgresql+psycopg://x:x@localhost/x"
        run: |
          # pipefail is NOT on by default in Actions' `bash -e` — without it the
          # pipeline exits with tee's status and a failing pytest reads as green.
          set -o pipefail
          pytest tests/integration -m integration -p no:randomly --strict-markers -rs \
            --junitxml=/tmp/integration.xml | tee /tmp/integration.txt

      - name: Enforce zero integration skips
        run: |
          # Every test in this suite is now environment-independent. Inspect
          # pytest's machine-readable report so any skip fails regardless of
          # reason text or terminal-summary formatting.
          python - <<'PY'
          import sys
          from xml.etree import ElementTree

          report = ElementTree.parse("/tmp/integration.xml")
          skipped = [
              case
              for case in report.getroot().iter("testcase")
              if case.find("skipped") is not None
          ]
          if skipped:
              print(f"::error::{len(skipped)} integration test(s) skipped; expected zero")
              for case in skipped:
                  print(f"SKIPPED {case.get('classname')}.{case.get('name')}")
              sys.exit(1)
          print("Integration suite reported zero skips.")
          PY

  deploy:
    needs: [check, test, contract, integration]
    # Production deploy is main-only. push already filters to main (on.push.branches), but
    # workflow_dispatch can be invoked against ANY ref, so guard the ref explicitly — otherwise
    # a dispatch from a feature branch would ship that branch's code to prod.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block, so `contents: read`
    # is restated here rather than inherited. `id-token: write` is what lets this
    # job mint the OIDC token it trades for the AWS role, and it is granted to this
    # job ONLY — the test/check jobs run on every pull request and must not be able
    # to request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Build zip
        run: |
          mkdir -p build
          pip install --no-deps -r requirements.lock -t build \
            --platform manylinux2014_aarch64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312 \
            --only-binary=:all:
          cp -r app build/
          find build -name "__pycache__" -type d -exec rm -rf {} +
          find build -name "*.pyc" -delete
          cd build && zip -r ../bundle.zip . && cd -
          ls -lh bundle.zip

      # SEC-system-hardening Step 3c: OIDC, not a long-lived key. The role's trust
      # policy pins `sub` AND `job_workflow_ref` with StringEquals, so only this
      # workflow file on this repo's main can assume it — `sub` alone would also
      # match a pull_request_target run, whose GITHUB_REF is the base branch. The
      # role can call exactly the Lambda actions below on ONE function; the shared
      # github-actions-deploy user it replaces could write four.
      #
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY remain set and are now unused;
      # they are deleted only after this lane is confirmed green in production.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-backend-deploy-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: Deploy to Lambda
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME:-ratemymusic-api}" \
            --zip-file fileb://bundle.zip \
            --architectures arm64

      # OPS-delivery-safety-gates Step 3 — post-deploy health smoke (health-only,
      # no credentials). The Lambda code is already live here, so this is
      # detect-and-alert-fast + rollback trigger, NOT a pre-cutover gate. A red
      # run means: roll back (re-run the previous green deploy from the Actions
      # tab, or re-push the previous bundle). Retries absorb update propagation.
      - name: Post-deploy smoke (health)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          URL="https://www.ratemymusic.blog/api/db/ping?_cb=${RUN_ID}"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$URL" | tee /tmp/ping.json | grep -q "Database connected"; then
              echo "Backend health OK."
              exit 0
            fi
            echo "attempt $i: health not green yet, retrying in 5s…"
            sleep 5
          done
          echo "::error::Backend health smoke FAILED — /api/db/ping did not report 'Database connected'. Roll back the deploy."
          exit 1
