name: Deploy Backend Lambda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # manual deploy of main HEAD (recovery if a push event fails to fire a run)

# Least privilege: default GITHUB_TOKEN is too broad; this workflow only needs to read the repo.
permissions:
  contents: read

# Serialize prod deploys so out-of-order pushes can't overwrite a newer Lambda with an older build.
concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt pyright

      - name: Type check (pyright)
        run: pyright app/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      # Unit suite only. Integration tests (tests/integration/*) are marked
      # `integration` and require a real DB via TEST_DB_URL — excluded from the
      # PR gate; they self-skip anyway when TEST_DB_URL is unset.
      - name: Run tests
        run: pytest -m "not integration"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify openapi.json is up to date
        env:
          DATABASE_URL: "postgresql+psycopg://x:x@localhost/x"
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  # Real-DB suite against the Neon test branch. Split from `test` because it needs
  # a live DB and runs ~8 min, where the unit gate runs in seconds.
  #
  # The branch was synced to prod schema (V2–V49) on 2026-07-29, which is what
  # makes this job meaningful: before that, every DB-bound suite in the repo
  # self-skipped and reported green — the false-green pattern that let two isrc
  # write-path defects through. So a skip is treated as a FAILURE here: if the
  # secret is missing or a suite opts out for a DB/schema reason, this job goes
  # red instead of quietly passing.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      # TEMPORARY diagnostic — remove before merge. Reports only the SHAPE of the
      # secret (length, scheme prefix, stray quoting/whitespace), never its value:
      # the leading characters of a malformed value are the wrapper, not the
      # credential. Added because a rotated secret failed to parse in BOTH repos.
      - name: Diagnose secret shape
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ.get("TEST_DB_URL", "")
          print("length:", len(v))
          print("leading 10 chars:", repr(v[:10]))
          print("has leading/trailing whitespace:", v != v.strip())
          print("contains newline:", "\n" in v)
          print("starts with postgresql://:", v.strip().startswith("postgresql://"))
          print("starts with postgresql+psycopg://:", v.strip().startswith("postgresql+psycopg://"))
          print("wrapped in quotes:", v.strip()[:1] in "\"'" or v.strip()[-1:] in "\"'")
          print("looks like a psql command:", v.strip().startswith("psql"))
          print("parses as a URL:", bool(re.match(r"^postgresql(\+\w+)?://[^:@/]+:[^@]+@[^/]+/\S+$", v.strip())))
          PY

      - name: Run integration suite
        env:
          TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
          DATABASE_URL: "postgresql+psycopg://x:x@localhost/x"
        run: |
          if [ -z "$TEST_DB_URL" ]; then
            echo "::error::TEST_DB_URL secret is not set on this repo — the integration suite would self-skip and report a false green. Set it (same value as myblog_worker's) and re-run."
            exit 1
          fi
          # pipefail is NOT on by default in Actions' `bash -e` — without it the
          # pipeline exits with tee's status and a failing pytest reads as green.
          set -o pipefail
          pytest tests/integration -m integration -rs | tee /tmp/integration.txt

      - name: Fail on DB-reason skips
        run: |
          # A suite that opts out because the schema/URL is missing must not pass
          # silently — that is exactly how the isrc defects survived CI.
          if grep -E '^SKIPPED' /tmp/integration.txt | grep -qiE 'TEST_DB_URL|test branch|not deployed|schema'; then
            echo "::error::a suite skipped for a DB/schema reason — treat as failure, not green:"
            grep -E '^SKIPPED' /tmp/integration.txt
            exit 1
          fi
          echo "No DB-reason skips."

  deploy:
    needs: [check, test, contract]
    # Production deploy is main-only. push already filters to main (on.push.branches), but
    # workflow_dispatch can be invoked against ANY ref, so guard the ref explicitly — otherwise
    # a dispatch from a feature branch would ship that branch's code to prod.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Build zip
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build --platform manylinux2014_aarch64 --only-binary=:all:
          cp -r app build/
          find build -name "__pycache__" -type d -exec rm -rf {} +
          find build -name "*.pyc" -delete
          cd build && zip -r ../bundle.zip . && cd -
          ls -lh bundle.zip

      - name: Deploy to Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME:-ratemymusic-api}" \
            --zip-file fileb://bundle.zip \
            --architectures arm64

      # OPS-delivery-safety-gates Step 3 — post-deploy health smoke (health-only,
      # no credentials). The Lambda code is already live here, so this is
      # detect-and-alert-fast + rollback trigger, NOT a pre-cutover gate. A red
      # run means: roll back (re-run the previous green deploy from the Actions
      # tab, or re-push the previous bundle). Retries absorb update propagation.
      - name: Post-deploy smoke (health)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          URL="https://www.ratemymusic.blog/api/db/ping?_cb=${RUN_ID}"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$URL" | tee /tmp/ping.json | grep -q "Database connected"; then
              echo "Backend health OK."
              exit 0
            fi
            echo "attempt $i: health not green yet, retrying in 5s…"
            sleep 5
          done
          echo "::error::Backend health smoke FAILED — /api/db/ping did not report 'Database connected'. Roll back the deploy."
          exit 1
